server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: all requests go to index.html (Vue Router will handle routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets with hash in filename (long-term)
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
